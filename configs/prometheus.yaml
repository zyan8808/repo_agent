global:
  scrape_interval: 15s

scrape_configs:
  - job_name: repo-agent-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]

  - job_name: repo-agent-worker
    static_configs:
      - targets: [worker:9100]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]