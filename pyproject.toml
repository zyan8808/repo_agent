[project]
name = "repo-agent"
version = "0.1.0"
description = "Durable local-first repository agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "litellm[proxy]>=1.75,<2",
    "mcp>=1.29,<2",
    "openai>=2.20,<3",
    "opentelemetry-distro>=0.57b0,<1",
    "opentelemetry-exporter-otlp>=1.36,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "prisma>=0.11,<1",
    "prometheus-client>=0.22,<1",
    "pyyaml>=6,<7",
    "pydantic-settings>=2.10,<3",
    "temporalio>=1.15,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
repo-agent-api = "repo_agent.api:run"
repo-agent-litellm = "repo_agent.litellm:run"
repo-agent-worker = "repo_agent.worker:run"

[dependency-groups]
dev = [
    "pyright>=1.1.403,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnknownVariableType = false